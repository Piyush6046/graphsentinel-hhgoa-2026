[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphsentinel"
version = "1.0.0"
description = "Policy-constrained agentic fraud investigation with TigerGraph"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
graphsentinel = "fraud_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

